<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnKana</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/favicon_io/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
</head>
<body>
    <nav id="navbar">
        <div id="nav-logo">
            <a href="/"><div id="logo-icon">あ</div></a>
        </div>
        <ul id="nav-tabs">
            <li><a class="tab" href="/">Hiragana</a></li>
            <li><a class="tab" href="/katakana">Katakana</a></li>
            <li><a class="tab" href="/study">Study</a></li>
        </ul>
        <ul id="nav-right">
            <li><a class="tab" href="/about">About</a></li>
            <li><a class="tab active" href="/contact">Contact</a></li>
        </ul>
    </nav>
    <div id="content">
        <div id="grid-panel" class="contact-panel">
            <div id="grid-header">
                <h2 id="grid-title">Contact</h2>
                <p id="grid-instructions">Have a suggestion, found a bug, or just want to say hi feel free to reach out.</p>
            </div>
            <iframe name="dummyframe" id="dummyframe" style="display:none;"></iframe>
            <form id="contact-form" action="https://api.web3forms.com/submit" method="POST" target="dummyframe">
                <input type="hidden" name="access_key" value="c6723e3d-44a1-4f39-9353-c547a7255540">
                <input type="checkbox" name="botcheck" style="display:none;">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="Message" rows="4" required></textarea>
                </div>
                <button type="submit">Send</button>
            </form>
            <p id="form-success" style="display:none;">Message received.</p>
        </div>
    </div>
    <script src="/index.js"></script>
    <script>
        document.getElementById('contact-form').addEventListener('submit', function() {
            setTimeout(() => {
                document.getElementById('contact-form').style.display = 'none';
                document.getElementById('grid-instructions').style.display = 'none';
                document.getElementById('grid-title').textContent = 'Sent';
                document.getElementById('form-success').style.display = 'block';
            }, 1000);
        });
    </script>
</body>
</html>
