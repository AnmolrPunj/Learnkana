<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="content-language" content="en">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Kana Learner</title>
    <meta name="description" content="Get in touch with feedback, bug reports, or suggestions for Kana Learner.">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/favicon_io/favicon.ico">
    <meta property="og:site_name" content="Kana Learner">
</head>
<body>
    <nav id="navbar">
        <div id="nav-logo">
            <a href="/"><div id="logo-icon">あ</div></a>
        </div>
        <ul id="nav-tabs">
            <li><a class="tab" href="/">Hiragana</a></li>
            <li><a class="tab" href="/katakana">Katakana</a></li>
            <li><a class="tab" href="/study">Study</a></li>
        </ul>
        <ul id="nav-right">
            <li><a class="tab" href="/about">About</a></li>
            <li><a class="tab active" href="/contact">Contact</a></li>
        </ul>
    </nav>
    <div id="content">
        <div id="grid-panel" class="contact-panel">
            <div id="grid-header">
                <h2 id="grid-title">Contact</h2>
                <p id="grid-instructions">Have a suggestion, found a bug, or just want to say hi feel free to reach out.</p>
            </div>
            <form id="contact-form">
                <input type="hidden" name="access_key" value="c6723e3d-44a1-4f39-9353-c547a7255540">
                <input type="checkbox" name="botcheck" style="display:none;">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Email (optional)">
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="Message" rows="4" required></textarea>
                </div>
                <button type="submit">Send</button>
            </form>
            <p id="form-success" style="display:none;">Message received.</p>
        </div>
    </div>
    <script src="/index.js"></script>
    <script>
        document.getElementById('contact-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.querySelector('#contact-form button');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            
            const formData = new FormData(this);
            
            await fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
            });
            
            document.getElementById('contact-form').style.display = 'none';
            document.getElementById('grid-instructions').style.display = 'none';
            document.getElementById('grid-title').textContent = 'Message Sent';
            document.getElementById('form-success').style.display = 'block';
        });
    </script>
</body>
</html>
